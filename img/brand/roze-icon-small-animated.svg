<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="-220.0 -220.0 440 440">
<title>ROZE — Ward Alkhatib</title>
<style>
.a{animation-duration:4.0s;animation-iteration-count:infinite;animation-fill-mode:both}
.servo{animation-name:servo}
@keyframes servo{
0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.6,0,.3,1)}
12%{transform:rotate(97deg);animation-timing-function:ease-in-out}
16%{transform:rotate(87deg);animation-timing-function:ease-in-out}
19.5%{transform:rotate(91deg);animation-timing-function:ease-out}
22%,100%{transform:rotate(90deg)}}
.gear{animation-name:gear}
@keyframes gear{
0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.6,0,.3,1)}
14%{transform:rotate(-40deg);animation-timing-function:ease-in-out}
19%{transform:rotate(-34.5deg);animation-timing-function:ease-out}
23%,100%{transform:rotate(-36deg)}}
.spark{animation-name:spark}
@keyframes spark{
0%{transform:scale(1);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
5%{transform:scale(1.28);animation-timing-function:ease-in-out}
13%,100%{transform:scale(1)}}
.ripple{animation-name:ripple}
@keyframes ripple{
0%{transform:scale(.9);opacity:0;animation-timing-function:ease-out}
4%{transform:scale(1.15);opacity:.85;animation-timing-function:cubic-bezier(.1,.6,.3,1)}
26%,100%{transform:scale(2.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
