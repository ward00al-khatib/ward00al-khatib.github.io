name: Build Bothaina_Roze APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-apk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        id: build
        working-directory: android
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > ../build-log.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish APK and log to the site
        run: |
          mkdir -p booklet/app
          tail -c 60000 build-log.txt > booklet/app/build-log.txt
          echo "exit code: ${{ steps.build.outputs.code }} — $(date -u)" >> booklet/app/build-log.txt
          if [ "${{ steps.build.outputs.code }}" = "0" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk booklet/app/Bothaina_Roze.apk
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add booklet/app
          git commit -m "Bothaina_Roze APK build (exit ${{ steps.build.outputs.code }}) [skip ci]" || echo "nothing to commit"
          git push
